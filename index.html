<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Malayalam Neo — учить малаялам</title>
  <meta name="description" content="Малаялам по фразам и манглишу: 255 уроков, 2500 фраз, озвучка и транскрипция.">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      padding: 24px; background: #f6f1e4; color: #223448;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main { width: min(460px, 100%); text-align: center; }
    .mark {
      width: 84px; height: 84px; margin: 0 auto 18px; display: grid; place-items: center;
      border-radius: 24px; background: #223448; color: #f6f1e4;
      font-size: 44px; line-height: 1;
    }
    h1 { margin: 0 0 10px; font-size: clamp(30px, 8vw, 42px); letter-spacing: -.03em; }
    p { margin: 0 0 22px; color: #5c6b6f; line-height: 1.55; }
    .start {
      display: block; padding: 16px 22px; border-radius: 16px; text-decoration: none;
      background: #58bd7b; color: #fff; font-weight: 800; font-size: 18px;
      box-shadow: 0 5px 0 #36965c;
    }
    .start:active { transform: translateY(2px); box-shadow: 0 3px 0 #36965c; }
    .links { margin-top: 18px; font-size: 14px; }
    .links a { color: #287e9a; }
    .small { margin-top: 26px; font-size: 12.5px; color: #8a9799; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">അ</div>
    <h1>Malayalam Neo</h1>
    <p>255 уроков, 2500 фраз, манглиш, озвучка и транскрипция.<br>Приложение живёт на постоянном адресе.</p>
    <a class="start" href="https://malayalam-neo.vercel.app">Начать учиться →</a>
    <p class="links">Telegram: <a href="https://t.me/KeralaFood_bot">@KeralaFood_bot</a></p>
    <p class="small">GitHub Pages оставлен как короткая ссылка на приложение.</p>
  </main>
</body>
</html>

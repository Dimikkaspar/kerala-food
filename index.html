<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KERALA MACRO // PRO</title>
    <style>
        :root {
            --bg-main: #0c0e12;
            --bg-card: #151821;
            --bg-input: #1e2330;
            --gold: #D4AF37;
            --gold-dim: rgba(212, 175, 55, 0.15);
            --sand: #c2b280;
            --cyan: #00f0ff;
            --magenta: #ff2a6d;
            --text-main: #f0f2f5;
            --text-muted: #8a93a6;
            --border: #282e3d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%; max-width: 100vw; overflow-x: hidden;
            background-color: var(--bg-main); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.4; padding-bottom: 85px;
        }
        .app-container { width: 100%; max-width: 500px; margin: 0 auto; padding: 12px; }
        .app-header {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 10px; margin-bottom: 12px; border-bottom: 1px solid var(--border);
        }
        .app-title { font-weight: 900; font-size: 1.05rem; color: var(--gold); letter-spacing: 0.8px; }
        .app-sub { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 0.7rem; color: var(--cyan); margin-top: 2px; }
        .tab-view { display: none; }
        .tab-view.active { display: block; }
        .card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 12px; padding: 14px; margin-bottom: 12px; width: 100%;
        }
        .card-header {
            font-family: ui-monospace, SFMono-Regular, monospace; font-size: 0.72rem;
            text-transform: uppercase; color: var(--gold); margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .macro-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
        .macro-box { background: var(--bg-input); border: 1px solid var(--border); padding: 10px 12px; border-radius: 8px; min-width: 0; }
        .macro-label { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 0.65rem; color: var(--text-muted); }
        .macro-val { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 1.05rem; font-weight: 700; margin: 4px 0 6px 0; }
        .macro-target { font-size: 0.75rem; color: var(--text-muted); font-weight: 400; }
        .progress-track { height: 5px; background: #0c0e12; border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; transition: width 0.2s ease; }
        .fill-kcal { background: var(--gold); }
        .fill-prot { background: var(--cyan); }
        .fill-fat { background: var(--sand); }
        .fill-carb { background: #6e7a94; }
        .fill-over { background: var(--magenta) !important; }
        .water-strip {
            background: var(--gold-dim); border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 8px 10px; border-radius: 8px; font-family: ui-monospace, SFMono-Regular, monospace;
            font-size: 0.72rem; display: flex; justify-content: space-between;
        }
        .presets-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 6px; }
        .chip-btn {
            flex: 0 0 auto; background: var(--bg-input); border: 1px solid var(--border);
            color: var(--text-main); padding: 9px 12px; border-radius: 8px;
            font-family: ui-monospace, SFMono-Regular, monospace; font-size: 0.73rem;
            cursor: pointer; touch-action: manipulation;
        }
        .chip-btn:active { background: var(--gold-dim); border-color: var(--gold); }
        .chip-oil { border-color: rgba(255, 42, 109, 0.5); color: #ff85a9; }
        .cat-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 8px; }
        .cat-tab {
            flex: 0 0 auto; background: #10131a; border: 1px solid var(--border);
            color: var(--text-muted); padding: 7px 11px; border-radius: 6px;
            font-size: 0.7rem; font-weight: 600; cursor: pointer; touch-action: manipulation;
        }
        .cat-tab.active { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
        label { display: block; font-size: 0.7rem; color: var(--text-muted); margin-bottom: 4px; }
        input, select {
            width: 100%; background: var(--bg-input); border: 1px solid var(--border);
            color: var(--text-main); padding: 11px 12px; border-radius: 8px;
            font-size: 16px; outline: none;
        }
        input:focus, select:focus { border-color: var(--gold); }
        .form-group { margin-bottom: 10px; }
        .form-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 10px; }
        .weight-pills { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
        .pill-btn {
            background: #10131a; border: 1px solid var(--border); color: var(--text-main);
            padding: 9px 4px; border-radius: 6px; font-family: ui-monospace, SFMono-Regular, monospace;
            font-size: 0.72rem; cursor: pointer; touch-action: manipulation;
        }
        .pill-btn.unit { border-color: rgba(0, 240, 255, 0.35); color: var(--cyan); }
        .btn-primary {
            width: 100%; background: var(--gold); color: #000; border: none;
            padding: 12px; border-radius: 8px; font-size: 0.85rem; font-weight: 800;
            text-transform: uppercase; cursor: pointer; touch-action: manipulation;
        }
        .btn-primary:active { opacity: 0.8; }
        .btn-reset {
            background: #1d141b; border: 1px solid var(--magenta); color: var(--magenta);
            padding: 7px 12px; border-radius: 6px; font-size: 0.7rem; font-weight: 700;
            text-transform: uppercase; cursor: pointer; touch-action: manipulation;
        }
        .log-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0; border-bottom: 1px solid #1f2430; gap: 8px;
        }
        .log-item:last-child { border-bottom: none; }
        .log-title { font-size: 0.85rem; font-weight: 600; color: var(--text-main); }
        .log-meta { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }
        .log-right { display: flex; align-items: center; gap: 10px; }
        .log-kcal { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 0.85rem; font-weight: 700; color: var(--gold); }
        .del-btn {
            background: #231922; border: 1px solid var(--magenta); color: var(--magenta);
            width: 30px; height: 30px; border-radius: 6px; font-weight: 700; cursor: pointer;
        }
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; background: #12151d;
            border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(3, 1fr);
            padding-bottom: env(safe-area-inset-bottom, 10px); z-index: 999;
        }
        .nav-btn {
            background: none; border: none; color: var(--text-muted); padding: 14px 4px;
            font-size: 0.75rem; font-weight: 700; text-transform: uppercase; cursor: pointer;
        }
        .nav-btn.active { color: var(--gold); border-top: 2px solid var(--gold); }
    </style>
</head>
<body>

<div class="app-container">
    <header class="app-header">
        <div>
            <div class="app-title">KERALA MACRO // 115+</div>
            <div class="app-sub" id="statusBadge">ДОБРАТЬ: 122Г БЕЛКА</div>
        </div>
        <button type="button" class="btn-reset" onclick="clearLog()">Сброс дня</button>
    </header>

    <!-- ВКЛАДКА 1: ДНЕВНИК -->
    <div id="tab-tracker" class="tab-view active">
        <div class="card">
            <div class="macro-grid">
                <div class="macro-box">
                    <div class="macro-label">ККАЛ</div>
                    <div class="macro-val"><span id="curKcal">0</span> <span class="macro-target">/ <span id="tarKcal">1758</span></span></div>
                    <div class="progress-track"><div id="barKcal" class="progress-fill fill-kcal"></div></div>
                </div>
                <div class="macro-box">
                    <div class="macro-label">БЕЛКИ (Г)</div>
                    <div class="macro-val"><span id="curProt" style="color: var(--cyan);">0</span> <span class="macro-target">/ <span id="tarProt">122</span></span></div>
                    <div class="progress-track"><div id="barProt" class="progress-fill fill-prot"></div></div>
                </div>
                <div class="macro-box">
                    <div class="macro-label">ЖИРЫ (Г)</div>
                    <div class="macro-val"><span id="curFat">0</span> <span class="macro-target">/ <span id="tarFat">68</span></span></div>
                    <div class="progress-track"><div id="barFat" class="progress-fill fill-fat"></div></div>
                </div>
                <div class="macro-box">
                    <div class="macro-label">УГЛЕВОДЫ (Г)</div>
                    <div class="macro-val"><span id="curCarb">0</span> <span class="macro-target">/ <span id="tarCarb">165</span></span></div>
                    <div class="progress-track"><div id="barCarb" class="progress-fill fill-carb"></div></div>
                </div>
            </div>
            <div class="water-strip">
                <span>Вода: <strong id="waterNorm" style="color: var(--gold);">2.5</strong> л</span>
                <span>Электролиты: <strong>1 Karikku</strong></span>
            </div>
        </div>

        <div class="presets-scroll">
            <button type="button" class="chip-btn chip-oil" onclick="addQuickOil()">+10г Масла (Кафе)</button>
            <button type="button" class="chip-btn" onclick="addPreset('clean_bf')">3 Яйца + Овсянка + Банан</button>
            <button type="button" class="chip-btn" onclick="addPreset('kerala_bf')">3 Appam + Egg Roast</button>
            <button type="button" class="chip-btn" onclick="addPreset('fish_meals')">Matta Rice + Рыба + Маш</button>
            <button type="button" class="chip-btn" onclick="addPreset('parotta_beef')">2 Parotta + Beef Roast</button>
        </div>

        <div class="card">
            <div class="card-header">
                <span>База (<span id="foundCount">115</span> продуктов)</span>
                <span id="foodMacroHint" style="color: var(--sand);">210 ккал / 100г</span>
            </div>

            <!-- ЖИВОЙ ПОИСК -->
            <div class="form-group">
                <input type="text" id="searchInput" placeholder="Поиск: аппам, тунец, шаурма, гречка, чай..." oninput="populateFoodSelect()">
            </div>

            <!-- КАТЕГОРИИ (СВАЙП) -->
            <div class="cat-scroll">
                <button type="button" class="cat-tab active" onclick="filterCat('ALL', this)">Все (115)</button>
                <button type="button" class="cat-tab" onclick="filterCat('KER_CARB', this)">Керала: База</button>
                <button type="button" class="cat-tab" onclick="filterCat('SEA', this)">Рыба / Море</button>
                <button type="button" class="cat-tab" onclick="filterCat('MEAT', this)">Мясо / Курица</button>
                <button type="button" class="cat-tab" onclick="filterCat('PROT', this)">Яйца / Молочка / Бобы</button>
                <button type="button" class="cat-tab" onclick="filterCat('BASE_CARB', this)">Крупы / Гарниры</button>
                <button type="button" class="cat-tab" onclick="filterCat('FRUIT', this)">Фрукты / Орехи / Масла</button>
                <button type="button" class="cat-tab" onclick="filterCat('SNACK', this)">Напитки / Стритфуд</button>
            </div>

            <div class="form-group">
                <select id="foodSelect" onchange="updateDefaultWeight()"></select>
            </div>

            <div class="form-row" style="align-items: end; margin-bottom: 4px;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label id="weightLabel">Вес (г) // 1 шт (50г)</label>
                    <input type="number" id="foodWeight" value="50" inputmode="numeric">
                </div>
                <button type="button" class="btn-primary" onclick="addSelectedFood()">+ В дневник</button>
            </div>

            <div class="weight-pills">
                <button type="button" class="pill-btn unit" onclick="setUnitPortion(1)" id="unitBtn1">1x (50г)</button>
                <button type="button" class="pill-btn unit" onclick="setUnitPortion(2)" id="unitBtn2">2x (100г)</button>
                <button type="button" class="pill-btn" onclick="setWeight(100)">100 г</button>
                <button type="button" class="pill-btn" onclick="setWeight(200)">200 г</button>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <span>Съедено за сегодня</span>
                <span id="itemsCount" style="color: var(--text-muted);">0 поз.</span>
            </div>
            <div id="logContainer"></div>
        </div>
    </div>

    <!-- ВКЛАДКА 2: СВОЯ ЕДА -->
    <div id="tab-custom" class="tab-view">
        <div class="card">
            <div class="card-header"><span>Добавить свой продукт в базу</span></div>
            <div class="form-group">
                <label>Название продукта</label>
                <input type="text" id="custName" placeholder="Напр. Протеиновый батончик Yoga Bar">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Ккал на 100г</label>
                    <input type="number" id="custKcal" placeholder="380" inputmode="decimal">
                </div>
                <div class="form-group">
                    <label>Станд. порция (г)</label>
                    <input type="number" id="custPortion" value="60" inputmode="numeric">
                </div>
            </div>
            <div class="form-row" style="grid-template-columns: repeat(3, minmax(0, 1fr));">
                <div class="form-group">
                    <label>Белки / 100г</label>
                    <input type="number" id="custProt" placeholder="20" step="0.1" inputmode="decimal">
                </div>
                <div class="form-group">
                    <label>Жиры / 100г</label>
                    <input type="number" id="custFat" placeholder="12" step="0.1" inputmode="decimal">
                </div>
                <div class="form-group">
                    <label>Угли / 100г</label>
                    <input type="number" id="custCarb" placeholder="45" step="0.1" inputmode="decimal">
                </div>
            </div>
            <button type="button" class="btn-primary" onclick="saveCustomFood()">Сохранить в мою базу</button>
        </div>
    </div>

    <!-- ВКЛАДКА 3: ПРОФИЛЬ -->
    <div id="tab-profile" class="tab-view">
        <div class="card">
            <div class="card-header"><span>Параметры тела и цель</span></div>
            <div class="form-row">
                <div class="form-group">
                    <label>Пол</label>
                    <select id="gender" onchange="saveProfile()">
                        <option value="m" selected>Мужской</option>
                        <option value="f">Женский</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Возраст</label>
                    <input type="number" id="age" value="34" inputmode="numeric" oninput="saveProfile()">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Рост (см)</label>
                    <input type="number" id="height" value="178" inputmode="numeric" oninput="saveProfile()">
                </div>
                <div class="form-group">
                    <label>Вес (кг)</label>
                    <input type="number" id="weight" value="68" step="0.5" inputmode="decimal" oninput="saveProfile()">
                </div>
            </div>
            <div class="form-group">
                <label>Активность</label>
                <select id="activity" onchange="saveProfile()">
                    <option value="1.2" selected>Сидячая работа / монтаж за ноутбуком</option>
                    <option value="1.375">Съемочные дни / байк / 1-3 тренировки</option>
                    <option value="1.55">Высокая (серфинг / зал 3-5 раз)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Вектор формы</label>
                <select id="goal" onchange="saveProfile()">
                    <option value="-0.18">Сушка / Дефицит (-18%)</option>
                    <option value="-0.10" selected>Рекомпозиция / Мягкий дефицит (-10%)</option>
                    <option value="0">Поддержка / Баланс энергии</option>
                    <option value="0.12">Набор сухой массы (+12%)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Норма белка (г на 1 кг веса)</label>
                <select id="protRatio" onchange="saveProfile()">
                    <option value="1.6">1.6 г/кг (Базовый тонус)</option>
                    <option value="1.8" selected>1.8 г/кг (Оптимальный стандарт)</option>
                    <option value="2.1">2.1 г/кг (Сушка / Силовой цикл)</option>
                </select>
            </div>
        </div>
    </div>
</div>

<nav class="bottom-nav">
    <button type="button" class="nav-btn active" onclick="switchTab('tab-tracker', this)">Дневник</button>
    <button type="button" class="nav-btn" onclick="switchTab('tab-custom', this)">+ Своя еда</button>
    <button type="button" class="nav-btn" onclick="switchTab('tab-profile', this)">Профиль</button>
</nav>

<script>

    // Формат компактной базы: [id, категория, Название, ккал, Б, Ж, У, вес_порции, подпись_порции]

    const defaultFoods = RAW_DB.map(function(r) {
        return { id: r[0], cat: r[1], name: r[2], kcal: r[3], p: r[4], f: r[5], c: r[6], unitW: r[7], unitName: r[8] };
    });

    let foodsDB = [];
    let dailyLog = [];
    let currentCat = 'ALL';
    let targets = { kcal: 1758, p: 122, f: 68, c: 165 };

    function switchTab(tabId, btnEl) {
        document.querySelectorAll('.tab-view').forEach(function(el) { el.classList.remove('active'); });
        document.querySelectorAll('.nav-btn').forEach(function(el) { el.classList.remove('active'); });
        document.getElementById(tabId).classList.add('active');
        btnEl.classList.add('active');
        window.scrollTo(0, 0);
    }

    function filterCat(cat, btn) {
        currentCat = cat;
        document.querySelectorAll('.cat-tab').forEach(function(el) { el.classList.remove('active'); });
        btn.classList.add('active');
        populateFoodSelect();
    }

    function populateFoodSelect() {
        const sel = document.getElementById('foodSelect');
        const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
        sel.innerHTML = '';

        const list = foodsDB.filter(function(f) {
            const matchCat = (currentCat === 'ALL') || (f.cat === currentCat);
            const matchQ = !q || f.name.toLowerCase().indexOf(q) !== -1 || f.id.indexOf(q) !== -1;
            return matchCat && matchQ;
        });

        document.getElementById('foundCount').textContent = list.length;

        if (list.length === 0) {
            const opt = document.createElement('option');
            opt.value = '';
            opt.textContent = 'Ничего не найдено — сбрось фильтр или добавь во вкладке + Своя еда';
            sel.appendChild(opt);
            return;
        }

        list.forEach(function(item) {
            const opt = document.createElement('option');
            opt.value = item.id;
            opt.textContent = item.name + ' (' + item.kcal + ' ккал | Б:' + item.p + ')';
            sel.appendChild(opt);
        });
        updateDefaultWeight();
    }

    function updateDefaultWeight() {
        const id = document.getElementById('foodSelect').value;
        const item = foodsDB.find(function(f) { return f.id === id; });
        if (!item) return;
        document.getElementById('foodWeight').value = item.unitW;
        document.getElementById('weightLabel').textContent = 'Вес (г) // ' + item.unitName;
        document.getElementById('foodMacroHint').textContent = item.kcal + ' ккал | Б:' + item.p + ' Ж:' + item.f + ' У:' + item.c;
        document.getElementById('unitBtn1').textContent = '1x (' + item.unitW + 'г)';
        document.getElementById('unitBtn2').textContent = '2x (' + (item.unitW * 2) + 'г)';
    }

    function setWeight(w) { document.getElementById('foodWeight').value = w; }

    function setUnitPortion(mult) {
        const id = document.getElementById('foodSelect').value;
        const item = foodsDB.find(function(f) { return f.id === id; });
        if (item) document.getElementById('foodWeight').value = item.unitW * mult;
    }

    function saveProfile() {
        const profile = {
            gender: document.getElementById('gender').value,
            age: parseFloat(document.getElementById('age').value) || 34,
            height: parseFloat(document.getElementById('height').value) || 178,
            weight: parseFloat(document.getElementById('weight').value) || 68,
            activity: parseFloat(document.getElementById('activity').value) || 1.2,
            goal: parseFloat(document.getElementById('goal').value) || -0.10,
            protRatio: parseFloat(document.getElementById('protRatio').value) || 1.8
        };
        safeSet('kerala_profile_v4', profile);
        calculateTargets();
        renderLog();
    }

    function calculateTargets() {
        const gender = document.getElementById('gender').value;
        const age = parseFloat(document.getElementById('age').value) || 34;
        const height = parseFloat(document.getElementById('height').value) || 178;
        const weight = parseFloat(document.getElementById('weight').value) || 68;
        const activity = parseFloat(document.getElementById('activity').value) || 1.2;
        const goal = parseFloat(document.getElementById('goal').value) || -0.10;
        const protRatio = parseFloat(document.getElementById('protRatio').value) || 1.8;

        const bmr = (10 * weight) + (6.25 * height) - (5 * age) + (gender === 'm' ? 5 : -161);
        const targetKcal = Math.round(bmr * activity * (1 + goal));
        const targetProt = Math.round(weight * protRatio);
        const targetFat = Math.round(weight * 1.0);
        const targetCarb = Math.max(40, Math.round((targetKcal - ((targetProt * 4) + (targetFat * 9))) / 4));

        targets = { kcal: targetKcal, p: targetProt, f: targetFat, c: targetCarb };
        document.getElementById('tarKcal').textContent = targets.kcal;
        document.getElementById('tarProt').textContent = targets.p;
        document.getElementById('tarFat').textContent = targets.f;
        document.getElementById('tarCarb').textContent = targets.c;
        document.getElementById('waterNorm').textContent = ((weight * 37) / 1000).toFixed(1);
    }

    function addFoodById(id, weight) {
        const item = foodsDB.find(function(f) { return f.id === id; });
        if (!item || weight <= 0) return;
        const ratio = weight / 100;
        dailyLog.unshift({
            uid: Date.now() + Math.floor(Math.random() * 1000),
            name: item.name,
            weight: Math.round(weight),
            kcal: Math.round(item.kcal * ratio),
            p: +(item.p * ratio).toFixed(1),
            f: +(item.f * ratio).toFixed(1),
            c: +(item.c * ratio).toFixed(1)
        });
        saveSetAndRender();
    }

    function addSelectedFood() {
        const id = document.getElementById('foodSelect').value;
        const weight = parseFloat(document.getElementById('foodWeight').value) || 100;
        addFoodById(id, weight);
    }

    function addQuickOil() { addFoodById('coco_oil', 10); }

    function addPreset(type) {
        if (type === 'kerala_bf') { addFoodById('appam', 150); addFoodById('egg_roast', 180); }
        else if (type === 'clean_bf') { addFoodById('eggs', 165); addFoodById('oats_dry', 60); addFoodById('nendran', 130); }
        else if (type === 'fish_meals') { addFoodById('matta', 200); addFoodById('neymeen', 150); addFoodById('cherupayar', 120); }
        else if (type === 'parotta_beef') { addFoodById('parotta', 180); addFoodById('beef_roast', 150); }
    }

    function removeEntry(uid) {
        dailyLog = dailyLog.filter(function(item) { return item.uid !== uid; });
        saveSetAndRender();
    }

    function clearLog() {
        dailyLog = [];
        saveSetAndRender();
    }

    function saveCustomFood() {
        const name = document.getElementById('custName').value.trim();
        if (!name) return;
        const unitW = parseFloat(document.getElementById('custPortion').value) || 100;
        const newFood = {
            id: 'cust_' + Date.now(),
            cat: 'PROT',
            name: name,
            kcal: parseFloat(document.getElementById('custKcal').value) || 0,
            p: parseFloat(document.getElementById('custProt').value) || 0,
            f: parseFloat(document.getElementById('custFat').value) || 0,
            c: parseFloat(document.getElementById('custCarb').value) || 0,
            unitW: unitW,
            unitName: 'порция (' + unitW + 'г)'
        };
        const savedCustom = safeGet('kerala_custom_v4', []);
        savedCustom.push(newFood);
        safeSet('kerala_custom_v4', savedCustom);
        foodsDB.unshift(newFood);
        populateFoodSelect();
        document.getElementById('custName').value = '';
        switchTab('tab-tracker', document.querySelectorAll('.nav-btn')[0]);
    }

    function saveSetAndRender() {
        safeSet('kerala_log_v4', dailyLog);
        renderLog();
    }

    function renderLog() {
        let totKcal = 0, totP = 0, totF = 0, totC = 0;
        dailyLog.forEach(function(item) {
            totKcal += item.kcal; totP += item.p; totF += item.f; totC += item.c;
        });
        totP = Math.round(totP); totF = Math.round(totF); totC = Math.round(totC);

        document.getElementById('curKcal').textContent = totKcal;
        document.getElementById('curProt').textContent = totP;
        document.getElementById('curFat').textContent = totF;
        document.getElementById('curCarb').textContent = totC;
        document.getElementById('itemsCount').textContent = dailyLog.length + ' поз.';

        updateBar('barKcal', totKcal, targets.kcal, false);
        updateBar('barProt', totP, targets.p, true);
        updateBar('barFat', totF, targets.f, false);
        updateBar('barCarb', totC, targets.c, false);

        const badge = document.getElementById('statusBadge');
        if (totKcal > targets.kcal * 1.05) {
            badge.textContent = 'ПЕРЕБОР ПО КАЛОРИЯМ';
            badge.style.color = 'var(--magenta)';
        } else if (totP >= targets.p * 0.95) {
            badge.textContent = 'НОРМА БЕЛКА ВЫПОЛНЕНА';
            badge.style.color = 'var(--cyan)';
        } else {
            badge.textContent = 'ДОБРАТЬ: ' + Math.max(0, targets.p - totP) + 'Г БЕЛКА';
            badge.style.color = 'var(--cyan)';
        }

        const container = document.getElementById('logContainer');
        if (dailyLog.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding: 14px 0; color: var(--text-muted); font-size: 0.8rem;">Дневник пуст</div>';
            return;
        }

        container.innerHTML = dailyLog.map(function(item) {
            return '<div class="log-item">' +
                '<div class="log-info">' +
                    '<div class="log-title">' + item.name + '</div>' +
                    '<div class="log-meta">' + item.weight + 'г // Б:' + item.p + ' Ж:' + item.f + ' У:' + item.c + '</div>' +
                '</div>' +
                '<div class="log-right">' +
                    '<span class="log-kcal">' + item.kcal + '</span>' +
                    '<button type="button" class="del-btn" onclick="removeEntry(' + item.uid + ')">✕</button>' +
                '</div>' +
            '</div>';
        }).join('');
    }

    function updateBar(elId, current, target, isProtein) {
        const el = document.getElementById(elId);
        const pct = Math.min(100, Math.round((current / target) * 100));
        el.style.width = pct + '%';
        if (!isProtein && current > target * 1.08) el.classList.add('fill-over');
        else el.classList.remove('fill-over');
    }

    function init() {
        const savedCustom = safeGet('kerala_custom_v4', []);
        foodsDB = savedCustom.concat(defaultFoods);
        const savedProfile = safeGet('kerala_profile_v4', null);
        if (savedProfile) {
            document.getElementById('gender').value = savedProfile.gender;
            document.getElementById('age').value = savedProfile.age;
            document.getElementById('height').value = savedProfile.height;
            document.getElementById('weight').value = savedProfile.weight;
            document.getElementById('activity').value = savedProfile.activity;
            document.getElementById('goal').value = savedProfile.goal;
            document.getElementById('protRatio').value = savedProfile.protRatio;
        }
        dailyLog = safeGet('kerala_log_v4', []);
        populateFoodSelect();
        calculateTargets();
        renderLog();
    }

    init();
</script>
</body>
</html>

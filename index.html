<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malayalam Learning App</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Malayalam Learning</h1>
            <p>Учите малаялам с удовольствием!</p>
        </header>

        <div class="language-selector">
            <button class="lang-btn" data-lang="ru">Русский</button>
            <button class="lang-btn" data-lang="en">English</button>
            <button class="lang-btn" data-lang="ml">മലയാളം</button>
        </div>

        <main class="app-main">
            <div id="content" class="content-area">
                <!-- Контент будет загружаться здесь -->
            </div>
        </main>

        <footer class="app-footer">
            <button id="start-btn" class="primary-btn">Начать учиться</button>
            <button id="next-btn" class="secondary-btn">Следующая фраза</button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
